# ── Layer 4: Operator Intent Parameters (disagreement metric) ────────────────
# Loaded by pick_place.launch into operator_intent_node private namespace (~/).
# All values can also be tuned live in rqt_reconfigure (dynamic_reconfigure).
# Changes here take effect on next roslaunch — no need to edit the node.
#
# Signal: D = normalized CBF-intervention magnitude, computed per subsystem:
#   d_base = ||u_H_base - u_R_base|| / max(||u_H_base||, v_ref_base)
#   d_arm  = ||u_H_arm  - u_R_arm||  / max(||u_H_arm||,  v_ref_arm)
#   D_raw  = clip(max(d_base, d_arm) + w_dir*relu(-cos_active), 0, 1)
#   D      = EMA(D_raw, ema_beta)
#   lambda_op = lambda_op_min + (lambda_op_max - lambda_op_min) * D
# D=0 → operator agrees with the safety filter; D=1 → operator is fighting it.

# Smoothing ───────────────────────────────────────────────────────────────────
# EMA factor on the raw disagreement. Lower = smoother/slower, higher = snappier.
ema_beta: 0.2

# Normalization floors ────────────────────────────────────────────────────────
# Per-subsystem reference speed (~0.1 * v_max) in the denominator. Prevents
# divide-by-zero and noise blow-up when the command is tiny. Base v_max≈0.20 m/s,
# arm v_max≈0.4 m/s.
v_ref_base: 0.02
v_ref_arm:  0.04

# Directional opposition weight ───────────────────────────────────────────────
# Optional extra caution when the operator commands AGAINST the safe reference
# (cos < 0 of the active subsystem). 0 disables it — the L2 norm already
# penalizes direction, so keep at 0 unless you want opposition to snap to max.
w_dir: 0.0

# Lambda mapping ───────────────────────────────────────────────────────────────
# lambda_op is linear in D, clamped to [lambda_op_min, lambda_op_max].
# min=0.1 keeps today's baseline caution in open space (D=0); lambda_op now rises
# toward max as the operator fights the filter. Set min=0 for "no extra caution
# when fully cooperative".
lambda_op_min: 0.1
lambda_op_max: 0.9

# Excitation guard ─────────────────────────────────────────────────────────────
# When ||u_H|| is below this on BOTH subsystems, the operator is not commanding,
# so D_raw is forced to 0 (no disagreement).
excitation_thresh: 0.01

# Idle reset ────────────────────────────────────────────────────────────────────
# If no command for idle_timeout_s seconds, D is reset to 0 (fully aligned).
reset_on_idle: true
idle_timeout_s: 5.0
